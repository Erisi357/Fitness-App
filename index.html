<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fitness App</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <article class="workout-card">
            <header class="header">
                <h1 class="workout-card-name">Full Body Strength</h1>
                <p class="workout-card-minutes">45 min</p>
            </header>

            <h1 class="workout-card-subtitle">Exercises</h1>
            <u class="workout-card-exercises">
                <li>Barbell Squat</li>
                <li>Bench Press</li>
                <li>Bent-Over Row</li>
                <li>Overhead Press</li>
                <li>Plank</li>
            </u>
        </article>
    </body>
</html>
